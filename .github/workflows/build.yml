name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # creating releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: cachix/install-nix-action@v30

      - name: Cache MSVC runtime and Windows SDK
        uses: actions/cache@v4
        with:
          path: |
            .xwin
            .xwin-cache
            .winsdk
          key: windows-sdk-${{ hashFiles('scripts/fetch-sdk.sh') }}

      - name: Apply patches
        run: nix develop --command ./scripts/apply-patches.sh

      # Downloads Microsoft's MSVC runtime and Windows SDK, accepting their license terms.
      - name: Fetch MSVC runtime and Windows SDK
        run: nix develop --command ./scripts/fetch-sdk.sh

      - name: Build
        run: |
          nix develop --command cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/clang-cl-xwin.cmake -DCMAKE_BUILD_TYPE=Release
          nix develop --command cmake --build build

      # Luma's Test configuration: adds the overlay's Info tab (render and output resolution) and extra logging.
      - name: Build Test variant
        run: |
          nix develop --command cmake -S . -B build-test -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/clang-cl-xwin.cmake -DCMAKE_BUILD_TYPE=Release -DLUMA_TEST_BUILD=ON
          nix develop --command cmake --build build-test

      - name: Package
        id: package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          nix develop --command ./scripts/package.sh build "$version"
          nix develop --command ./scripts/package.sh build-test "$version" Test

      - uses: actions/upload-artifact@v4
        with:
          name: LumaSongOfHorror-${{ steps.package.outputs.version }}
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LumaSongOfHorror ${{ github.ref_name }}
          files: dist/*
          body: |
            Patched Luma Framework Unreal Engine mod with FSR 4 / FSR 3 / XeSS upscaling for Song of Horror, with a Render Resolution setting for the FSR presets.
            Extract the zip next to `SongOfHorror-Win64-Shipping.exe` and follow the [installation steps](https://github.com/${{ github.repository }}#installation).
            The `-Test` zip is Luma's Test configuration: the same mod plus an **Info** tab in the overlay (render and output resolution) and more logging.

            Developed and tested on Linux only (AMD RX 6800 XT, Proton-CachyOS), with FSR 4 only (FSR 3 and XeSS are untested), against Steam build 8260563 of the game.
